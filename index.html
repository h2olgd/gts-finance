<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTS Finance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <h1>GTS Finance Calculator</h1>

    <!-- Mode Switch -->
    <button id="switchMode">Switch Mode</button>

    <!-- Monthly Payment Panel -->
    <section id="paymentPanel" class="card">
      <h2>Monthly Payment Calculator</h2>

      <label>Vehicle Price</label>
      <input type="number" id="price">

      <label>Down Payment</label>
      <input type="number" id="down">

      <label>APR (%)</label>
      <input type="number" id="apr">

      <label>Term (years)</label>
      <input type="number" id="years">

      <label>Trade-in Value</label>
      <input type="number" id="trade">

      <button id="calcPaymentBtn">Calculate Monthly Payment</button>

      <div id="result"></div>
    </section>

    <!-- Down Payment Solver Panel -->
    <section id="downPanel" class="card hidden">
      <h2>Down Payment Solver</h2>

      <label>Target Monthly Payment</label>
      <input type="number" id="targetPayment">

      <label>APR (%)</label>
      <input type="number" id="apr2">

      <label>Term (years)</label>
      <input type="number" id="years2">

      <label>Trade-in Value</label>
      <input type="number" id="trade2">

      <button id="calcDownBtn">Calculate Required Down Payment</button>

      <div id="downResult"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
